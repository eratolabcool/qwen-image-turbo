# Builds the Qwen-Image-2.1-Turbo RunPod serverless worker image (linux/amd64)
# and pushes it to Docker Hub. RunPod pulls the public image directly.
name: Build RunPod Image

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub runners start with ~14GB free; torch + CUDA deps need more.
      # Drop preinstalled toolchains to free ~25GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeComparison \
            /usr/local/share/boost /usr/lib/jvm
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            eratolabcool/qwen-image-turbo:v2
            eratolabcool/qwen-image-turbo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
